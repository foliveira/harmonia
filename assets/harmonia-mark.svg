<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 13" width="24" height="13" fill="none" stroke="#e84400" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Harmonia">
  <!-- Three arcs rising from a horizon, radii 3:6:9 - the harmonic series
       (fundamental, octave, octave and a fifth), which is what the name is
       about. Drawn on the 24 horizontal grid at the 1.5 outline weight, round
       caps and joins, no fill. The box is cut to the mark: a semicircle is 2:1,
       so a square viewBox would be a third empty above and below.
       The accent is baked because no stylesheet reaches a README image. -->
  <path d="M2.5 11H21.5" />
  <path d="M3 11A9 9 0 0 1 21 11" />
  <path d="M6 11A6 6 0 0 1 18 11" />
  <path d="M9 11A3 3 0 0 1 15 11" />
</svg>
