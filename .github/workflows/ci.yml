name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # bats comes from apt, not npm: the runner's npm prefix is /usr/local and
      # the runner user cannot write the man tree under it, so `npm install -g
      # bats` dies with EACCES on /usr/local/share/man/man7. noble carries
      # bats 1.10 and the suite uses nothing newer.
      - name: Install the engine toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats yamllint jq
          # pipx, not pip: the runner image is PEP 668 managed, so a plain
          # `pip install --user` fails with externally-managed-environment.
          pipx install check-jsonschema
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Record the toolchain
        run: |
          for t in bats jq yamllint check-jsonschema; do
            printf '%-18s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - name: Validate lifecycle YAML, schema and lens resolution
        run: bash bin/validate-core.sh

      - name: Run the suite
        run: bats tests/
